<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="dashboard_body">
    <div class="dashboard_contenedor">

        <!-- encabezado -->
        <div class="header">
            <!-- logo y titulo -->
            <div class="header_izquierda">
                <div class="logo">
                    <img class="logo_imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTYsadbTtB2L0zb_QCn8bbTemDIn6pe_RbXOv18hlnSHDP5gUVmM-Bois&s=10" alt="Logo de la firma">
                </div>
                <div class="titulo">Panel del Abogado</div>
            </div>

            <!-- usuario -->
            <div class="usuario">
                <img class="usuario_imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTuCoHVCVc_S5dTaC55pxsgVYWDnorxG9PbY6ecvDLtbyV2BVA4o_vx3Ei&s=10" alt="Foto del abogado">
                <span>Bienvenido, Lic. Juan Pérez</span>
            </div>

            <!-- menu -->
            <div class="menu">
                <div class="enlace"><a href="#">Inicio</a></div>
                <div class="enlace"><a href="#">Mis Casos</a></div>
                <div class="enlace"><a href="#">Audiencias</a></div>
                <div class="enlace"><a href="#">Cerrar Sesión</a></div>
            </div>
        </div>

        <!-- contenido principal -->
        <div class="contenido_principal">
            <div class="seccion_titulo">Resumen de Casos</div>

            <!-- tarjetas -->
            <div class="tarjetas_contenedor">
                <!-- tarjeta casos activos -->
                <div class="tarjeta">
                    <div class="tarjeta_info">
                        <div class="tarjeta_icono">
                            <img class="tarjeta_imagen" src="https://thumbs.dreamstime.com/b/abogado-con-icono-de-malet%C3%ADn-362058326.jpg" alt="Ícono casos activos">
                        </div>
                        <div class="tarjeta_titulo">Casos Activos</div>
                    </div>
                    <div class="tarjeta_numero">12</div>
                </div>

                <!-- tarjeta proximas audiencias -->
                <div class="tarjeta">
                    <div class="tarjeta_info">
                        <div class="tarjeta_icono">
                            <img class="tarjeta_imagen" src="https://cdn-icons-png.magnific.com/256/12511/12511018.png?semt=ais_white_label" alt="Ícono audiencias">
                        </div>
                        <div class="tarjeta_titulo">Próximas Audiencias</div>
                    </div>
                    <div class="tarjeta_numero">4</div>
                </div>

                <!-- tarjeta terminos por vencer -->
                <div class="tarjeta">
                    <div class="tarjeta_info">
                        <div class="tarjeta_icono">
                            <img class="tarjeta_imagen" src="https://cdn-icons-png.flaticon.com/512/10755/10755029.png" alt="Ícono vencimientos">
                        </div>
                        <div class="tarjeta_titulo">Términos por Vencer</div>
                    </div>
                    <div class="tarjeta_numero">2</div>
                </div>
            </div>
        </div>

        <!-- pie de pagina -->
        <div class="footer">
            <div class="copyright">© 2026 Despacho Jurídico</div>
        </div>

    </div>
</body>

</html>
