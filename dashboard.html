<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div>
        <!-- Encabezado -->
        <div class="header">
            <div class="logo">
                <img class="imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTYsadbTtB2L0zb_QCn8bbTemDIn6pe_RbXOv18hlnSHDP5gUVmM-Bois&s=10"
                    alt="Logo de la firma">
            </div>
            <div class="titulo">Panel del Abogado</div>
            <div class="usuario">
                <img class="imagen-1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTuCoHVCVc_S5dTaC55pxsgVYWDnorxG9PbY6ecvDLtbyV2BVA4o_vx3Ei&s=10"
                    alt="Foto del abogado">
                Bienvenido, Lic. Juan Pérez
            </div>

            <div class="menu">
                <div class="enlace"><a href="#">Inicio</a></div>
                <div class="enlace"><a href="#">Mis Casos</a></div>
                <div class="enlace"><a href="#">Audiencias</a></div>
                <div class="enlace"><a href="#">Cerrar Sesión</a></div>
            </div>
        </div>
        <!-- Sección de Métricas / Tarjetas -->
        <div class="contenido-principal">
            <div class="seccion-titulo">Resumen de Casos</div>

            <div class="tarjeta">
                <div class="tarjeta-icono">
                    <img class="imagen-2" src="https://thumbs.dreamstime.com/b/abogado-con-icono-de-malet%C3%ADn-362058326.jpg"
                        alt="Ícono casos activos">
                </div>
                <div class="tarjeta-titulo">Casos Activos</div>
                <div class="tarjeta-numero">12</div>
            </div>

            <div class="tarjeta">
                <div class="tarjeta-icono">
                    <img class="imagen-3" src="https://cdn-icons-png.magnific.com/256/12511/12511018.png?semt=ais_white_label"
                        alt="Ícono audiencias">
                </div>
                <div class="tarjeta-titulo">Próximas Audiencias</div>
                <div class="tarjeta-numero">4</div>
            </div>

            <div class="tarjeta">
                <div class="tarjeta-icono">
                    <img class="imagen-4" src="https://cdn-icons-png.flaticon.com/512/10755/10755029.png" alt="Ícono vencimientos">
                </div>
                <div class="tarjeta-titulo">Términos por Vencer</div>
                <div class="tarjeta-numero">2</div>
            </div>
        </div>

        <!-- Pie de página -->
        <div class="footer">
            <div class="copyright">© 2026 Despacho Jurídico</div>
        </div>

    </div>
</body>

</html>
