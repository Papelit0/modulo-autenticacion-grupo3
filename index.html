<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login_body">
    <!-- contenedor login -->
    <div class="login_container">

        <!-- imagen del login -->
        <div class="login_imagen_caja">
            <img class="login_fondo" src="https://tse3.mm.bing.net/th/id/OIP.i6iLMU8-6pWsygR5kZGAXQHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagen decorativa">
        </div>

        <!-- datos de usuario -->
        <div class="login_datos">
            <h1>Iniciar sesión</h1>

            <!-- input correo -->
            <h2>Correo</h2>
            <input type="text" name="correo" placeholder="Ingrese su correo electrónico" id="correo">

            <!-- input contraseña -->
            <h2>Contraseña</h2>
            <input type="password" name="password" placeholder="Ingrese la contraseña" id="password">

            <!-- link olvidar contraseña -->
            <a href="#">¿Olvidaste tu Contraseña?</a>

            <!-- boton ingresar -->
            <div class="login_boton">
                <button type="button">Ingresar</button>
            </div>
        </div>

    </div>
</body>

</html>
